# SonarCloud analysis, run by .github/workflows/sonar.yaml.
sonar.organization=somejavadev-github
sonar.projectKey=somejavadev-github_electric-fence
sonar.projectName=Electric Fence

sonar.sources=custom_components/electric_fence,frontend/src
sonar.tests=tests,frontend/test
# Build output, brand images and the vendored generator are not our source.
sonar.exclusions=custom_components/electric_fence/frontend_dist/**,custom_components/electric_fence/brand/**,scripts/build_phcc.py
sonar.sourceEncoding=UTF-8

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Ruff with Home Assistant's rule set (pyproject.toml) is the Python style
# authority; its findings are imported so SonarCloud shows the same checks.
sonar.python.ruff.reportPaths=ruff-report.json
