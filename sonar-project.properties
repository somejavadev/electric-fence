# SonarCloud analysis, run by .github/workflows/sonar.yaml.
sonar.organization=somejavadev-github
sonar.projectKey=somejavadev-github_electric-fence
sonar.projectName=Electric Fence

sonar.sources=custom_components/electric_fence,frontend/src
sonar.tests=tests,frontend/test
# Build output, brand images and the vendored generator are not our source.
sonar.exclusions=custom_components/electric_fence/frontend_dist/**,custom_components/electric_fence/brand/**,scripts/build_phcc.py
sonar.sourceEncoding=UTF-8

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Ruff with Home Assistant's rule set (pyproject.toml) is the Python style
# authority; its findings are imported so SonarCloud shows the same checks.
sonar.python.ruff.reportPaths=ruff-report.json

# Rules switched off where they contradict Home Assistant's conventions (Core's
# ruff and pyproject settings, the Lit idioms the HA frontend uses) or flag a
# deliberate choice. Everything else in "Sonar way" stays on.
sonar.issue.ignore.multicriteria=py1,py2,py3,py4,py5,py6,py7,py8,py9,ts1,ts2,ts3,ts4,ts5,ts6,ts7
# async_* functions keep the async signature Core calls them with, even
# without an await (platform setup, posture checks, updater callbacks).
sonar.issue.ignore.multicriteria.py1.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.py1.resourceKey=custom_components/electric_fence/**/*.py
# Platform and handler signatures (async_setup, async_setup_entry, the
# parameter extractors) are fixed by Core, used or not.
sonar.issue.ignore.multicriteria.py2.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.py2.resourceKey=custom_components/electric_fence/**/*.py
# Core switches complexity limits off (PLR0911, PLR0912 and PLR0915 are in
# its ruff ignore list).
sonar.issue.ignore.multicriteria.py3.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.py3.resourceKey=custom_components/electric_fence/**/*.py
# ruff format, HA's formatter, adds these parentheses to wrap long lines.
sonar.issue.ignore.multicriteria.py4.ruleKey=python:S1110
sonar.issue.ignore.multicriteria.py4.resourceKey=custom_components/electric_fence/**/*.py
# HA's ruff rule C416 requires dict() here: the two rules contradict.
sonar.issue.ignore.multicriteria.py5.ruleKey=python:S7494
sonar.issue.ignore.multicriteria.py5.resourceKey=custom_components/electric_fence/**/*.py
# Deliberate snapshot copies: the registry or set can change while iterated
# (subscriptions remove themselves when closed).
sonar.issue.ignore.multicriteria.py6.ruleKey=python:S7504
sonar.issue.ignore.multicriteria.py6.resourceKey=custom_components/electric_fence/**/*.py
# The fail-open guard must never log the exception message (it may contain
# usernames), which logging.exception() would.
sonar.issue.ignore.multicriteria.py7.ruleKey=python:S8572
sonar.issue.ignore.multicriteria.py7.resourceKey=custom_components/electric_fence/failopen.py
# Private and shared address ranges (RFC 1918, RFC 6598) skipped by the
# lookup; they are not hosts that are contacted.
sonar.issue.ignore.multicriteria.py8.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.py8.resourceKey=custom_components/electric_fence/geo/base.py
# HA test idiom: pytest.raises around one call whose arguments are built
# inline.
sonar.issue.ignore.multicriteria.py9.ruleKey=python:S5778
sonar.issue.ignore.multicriteria.py9.resourceKey=tests/**/*.py
# Lit declares reactive properties and styles as static class fields, as the
# HA frontend does; subclasses extend them.
sonar.issue.ignore.multicriteria.ts1.ruleKey=typescript:S1444
sonar.issue.ignore.multicriteria.ts1.resourceKey=frontend/src/**/*.ts
sonar.issue.ignore.multicriteria.ts2.ruleKey=typescript:S2933
sonar.issue.ignore.multicriteria.ts2.resourceKey=frontend/src/**/*.ts
# Conditional rendering in Lit templates and sentence copy, as in the HA
# frontend.
sonar.issue.ignore.multicriteria.ts3.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.ts3.resourceKey=frontend/src/**/*.ts
sonar.issue.ignore.multicriteria.ts4.ruleKey=typescript:S4624
sonar.issue.ignore.multicriteria.ts4.resourceKey=frontend/src/**/*.ts
# Same as Python: no complexity limit, matching Core.
sonar.issue.ignore.multicriteria.ts5.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.ts5.resourceKey=frontend/src/**/*.ts
# `void param` marks the unused parameters of overridable hooks.
sonar.issue.ignore.multicriteria.ts6.ruleKey=typescript:S3735
sonar.issue.ignore.multicriteria.ts6.resourceKey=frontend/src/views/live-view.ts
# Only primitives reach the final String(): records and arrays return earlier.
sonar.issue.ignore.multicriteria.ts7.ruleKey=typescript:S6551
sonar.issue.ignore.multicriteria.ts7.resourceKey=frontend/src/change-lines.ts
