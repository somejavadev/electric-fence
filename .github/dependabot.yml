# Weekly dependency updates. Each pull request runs the full CI, which also
# fails early when an update breaks against Home Assistant.
#
# Not covered here: maxminddb in custom_components/electric_fence/manifest.json
# (Dependabot does not read Home Assistant manifests).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Stay in sync with Home Assistant, never ahead of it:
    # - requirements_ha.txt moves as one set per Core release, which separate
    #   bumps can't do. The nightly `stable` cell tests each new release.
    # - pyotp, mypy and ruff are pinned to Home Assistant Core's versions;
    #   change them when Core does.
    # - maxminddb must equal the pin in the integration's manifest.json, which
    #   Dependabot cannot update.
    ignore:
      - dependency-name: homeassistant
      - dependency-name: pytest-homeassistant
      - dependency-name: home-assistant-frontend
      - dependency-name: aiohasupervisor
      - dependency-name: pyotp
      - dependency-name: mypy
      - dependency-name: ruff
      - dependency-name: maxminddb
    groups:
      python-tooling:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # TypeScript majors wait until typescript-eslint supports them (TypeScript
    # 7 failed: typescript-eslint 8.72 peers on typescript < 7).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
