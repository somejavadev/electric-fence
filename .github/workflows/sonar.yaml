name: SonarCloud

# Code quality and security analysis with coverage from both test suites.
# Python style follows Home Assistant through ruff (imported as a report);
# see sonar-project.properties.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      # Absent for Dependabot and forked pull requests: the analysis is skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for SonarCloud's blame and new-code detection.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # Same install as the Tests workflow (see the note there).
      - name: Install Home Assistant (dev) and test tooling
        run: scripts/ci_install_ha.sh dev
      - name: Python tests with coverage
        run: pytest --cov --cov-report=xml
      - name: Ruff report for SonarCloud
        run: ruff check --output-format=json --exit-zero . > ruff-report.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests with coverage
        working-directory: frontend
        run: |
          npm ci
          npm run coverage
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
