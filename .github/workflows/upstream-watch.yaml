name: Upstream watch

# Daily list of Home Assistant Core changes on `dev` that touch code this
# integration relies on (the paths behind its runtime contracts, listed in
# scripts/upstream_watch.sh), as a comment on the `upstream-watch` issue.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List watched upstream changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/upstream_watch.sh
