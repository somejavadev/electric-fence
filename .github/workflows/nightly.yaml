name: Nightly upstream

# Fail early when upstream Home Assistant changes affect the integration. Each
# cell installs a different Core; beta and dev failures open (or update) an
# `upstream-break` issue.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: ${{ matrix.ha }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        ha: [min, stable, beta, dev]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Resolve the Core ref
        id: ref
        env:
          CELL: ${{ matrix.ha }}
        run: echo "ref=$(scripts/ci_resolve_ref.sh "$CELL")" >> "$GITHUB_OUTPUT"
      # Writes CORE_SHA and CORE_VERSION to the environment of later steps. The
      # PyPI pytest-homeassistant-custom-component has no 2026.11 build, so the
      # plugin is generated from this Core (see scripts/ci_install_ha.sh).
      - name: Install Home Assistant ${{ steps.ref.outputs.ref }}
        env:
          CORE_REF: ${{ steps.ref.outputs.ref }}
        run: scripts/ci_install_ha.sh "$CORE_REF"
      # Before a new minimum ships, some cells still resolve to an older Core
      # (for example `rc` is 2026.10 until the 2026.11 betas): skip, don't fail.
      - name: Check the Core is supported
        id: supported
        run: |
          ok="$(scripts/ci_supported_core.sh "$CORE_VERSION")"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [[ "$ok" != true ]]; then
            echo "::notice::Skipped: Home Assistant $CORE_VERSION is older than Electric Fence's minimum $(scripts/ci_supported_core.sh --print-minimum)."
          fi
      - name: Contract and safety tests
        if: steps.supported.outputs.ok == 'true'
        run: pytest tests/contracts tests/safety -m "not benchmark" --junitxml=junit-contracts.xml
      - name: Full suite
        if: ${{ !cancelled() && steps.supported.outputs.ok == 'true' }}
        run: pytest -m "not benchmark" --junitxml=junit-full.xml
      - name: Benchmark
        if: ${{ !cancelled() && steps.supported.outputs.ok == 'true' }}
        run: pytest -m benchmark -s --junitxml=junit-benchmark.xml
      - name: Report the upstream break
        # An install failure still reports (ok is unset); only a known older Core skips.
        if: ${{ failure() && steps.supported.outputs.ok != 'false' && (matrix.ha == 'beta' || matrix.ha == 'dev') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CELL: ${{ matrix.ha }}
          CORE_REF: ${{ steps.ref.outputs.ref }}
        run: |
          core="${CORE_VERSION:-$CORE_REF}"
          [[ "$CELL" == dev ]] && core="${CORE_SHA:-$CORE_REF}"
          scripts/report_upstream_break.sh "$CELL" "$core" junit-contracts.xml junit-full.xml junit-benchmark.xml
