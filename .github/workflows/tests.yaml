name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_ha.txt
            requirements_test.txt
      # The release pinned in requirements_ha.txt. Newer Cores are covered by
      # the nightly workflow.
      - name: Install Home Assistant and test tooling
        run: pip install -r requirements_ha.txt -r requirements_test.txt
      # The frontend bundle is not built here: tests/test_panel.py does not
      # need frontend_dist. The Frontend workflow builds and tests it.
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components
      - run: pytest --cov --cov-report=term-missing
      - run: python scripts/check_coverage.py
