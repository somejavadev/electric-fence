name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # Home Assistant 2026.11.0 is not on PyPI yet and the PyPI
      # pytest-homeassistant-custom-component has no 2026.11 build (0.13.374
      # pins 2026.10.3, which these tests are not compatible with). Until both
      # exist, install Core at `dev` and generate the plugin from it. Replace
      # with a plain `pip install -r requirements_test.txt` once they do.
      - name: Install Home Assistant (dev) and test tooling
        run: scripts/ci_install_ha.sh dev
      # The frontend bundle is not built here: tests/test_panel.py does not
      # need frontend_dist. The Frontend workflow builds and tests it.
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components
      - run: pytest --cov --cov-report=term-missing
      - run: python scripts/check_coverage.py
