name: Release

# Two jobs, so third-party code never runs next to a token that can write the
# repository: `build` runs npm with read-only access, and `publish` (which can
# write) runs no dependency code, only GitHub's own actions and `gh`.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag equals the manifest version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(jq -r .version custom_components/electric_fence/manifest.json)"
          if [[ "$TAG" != "$version" ]]; then
            echo "::error::Release tag '$TAG' does not equal manifest version '$version' (tags are plain, e.g. 0.1.0, with no v prefix)."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # No cache: a release is built from a clean install.
      - name: Build the frontend
        working-directory: frontend
        # --ignore-scripts: no dependency install script runs. The build
        # needs none (native packages come as optional dependencies).
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run check:flags
      # frontend_dist/ is git-ignored, so this zip is the only way it ships.
      - name: Zip the integration
        run: |
          test -n "$(ls custom_components/electric_fence/frontend_dist)"
          cd custom_components/electric_fence
          zip -r ../../electric_fence.zip . -x '*/__pycache__/*' -x '__pycache__/*'
          cd ../..
          sha256sum electric_fence.zip > electric_fence.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            electric_fence.zip
            electric_fence.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Check the checksum
        run: sha256sum --check electric_fence.zip.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: electric_fence.zip
      # No --clobber: an asset already on the release is never replaced
      # silently. To rebuild, delete the asset first.
      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" electric_fence.zip electric_fence.zip.sha256
