name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag equals the manifest version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(jq -r .version custom_components/electric_fence/manifest.json)"
          if [[ "$TAG" != "$version" ]]; then
            echo "::error::Release tag '$TAG' does not equal manifest version '$version' (tags are plain, e.g. 0.1.0, with no v prefix)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # frontend_dist/ is git-ignored, so this zip is the only way it ships.
      - name: Zip the integration
        run: |
          test -n "$(ls custom_components/electric_fence/frontend_dist)"
          cd custom_components/electric_fence
          zip -r ../../electric_fence.zip . -x '*/__pycache__/*' -x '__pycache__/*'
      - name: Upload the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" electric_fence.zip --clobber
